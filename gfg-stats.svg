<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif">
  <defs>
    <style>
      .title { fill: #ffffff; font-size: 22px; font-weight: bold; }
      .rank { fill: #ffffff; font-size: 13px; font-weight: bold; }
      .label { fill: #e6edf3; font-size: 15px; font-weight: bold; }
      .value { fill: #ffffff; font-size: 15px; font-weight: bold; }
      .center-num { fill: #ffffff; font-size: 34px; font-weight: bold; }
      .center-sub { fill: #9aa4af; font-size: 12px; }
      .footer { fill: #9aa4af; font-size: 11px; }
    </style>
  </defs>

  <!-- Card background -->
  <rect x="1" y="1" width="698" height="258" rx="14" fill="#0d1117" stroke="#2a2f37" stroke-width="1.5"/>

  <!-- Header -->
  <circle cx="38" cy="38" r="14" fill="#2f8d46"/>
  <text x="38" y="43" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">&lt;/&gt;</text>
  <text x="62" y="45" class="title">Ayush Dongre</text>

  <rect x="565" y="24" width="110" height="28" rx="14" fill="#161b22" stroke="#2f8d46" stroke-width="1"/>
  <text x="620" y="42" text-anchor="middle" class="rank">Institute Rank 414</text>

  <line x1="24" y1="66" x2="676" y2="66" stroke="#21262d" stroke-width="1.5"/>

  <!-- Donut ring -->
  <g transform="translate(100,165)">
    <circle r="54" fill="none" stroke="#21262d" stroke-width="14"/>
    <circle r="54" fill="none" stroke="#14b8a6" stroke-width="14"
      stroke-dasharray="14.65 324.64" stroke-dashoffset="0" transform="rotate(-90)"/>
    <circle r="54" fill="none" stroke="#2f8d46" stroke-width="14"
      stroke-dasharray="63.46 275.83" stroke-dashoffset="-14.65" transform="rotate(-90)"/>
    <circle r="54" fill="none" stroke="#ffa116" stroke-width="14"
      stroke-dasharray="239.21 100.08" stroke-dashoffset="-78.11" transform="rotate(-90)"/>
    <circle r="54" fill="none" stroke="#ff2d55" stroke-width="14"
      stroke-dasharray="21.97 317.32" stroke-dashoffset="-317.32" transform="rotate(-90)"/>
    <text x="0" y="6" text-anchor="middle" class="center-num">139</text>
    <text x="0" y="24" text-anchor="middle" class="center-sub">Solved</text>
  </g>

  <!-- Difficulty rows -->
  <g transform="translate(230,92)">
    <!-- Basic -->
    <text x="0" y="10" class="label">Basic</text>
    <text x="430" y="10" text-anchor="end" class="value">6</text>
    <rect x="0" y="16" width="430" height="6" rx="3" fill="#21262d"/>
    <rect x="0" y="16" width="18.5" height="6" rx="3" fill="#14b8a6"/>

    <!-- Easy -->
    <text x="0" y="50" class="label">Easy</text>
    <text x="430" y="50" text-anchor="end" class="value">26</text>
    <rect x="0" y="56" width="430" height="6" rx="3" fill="#21262d"/>
    <rect x="0" y="56" width="80.5" height="6" rx="3" fill="#2f8d46"/>

    <!-- Medium -->
    <text x="0" y="90" class="label">Medium</text>
    <text x="430" y="90" text-anchor="end" class="value">98</text>
    <rect x="0" y="96" width="430" height="6" rx="3" fill="#21262d"/>
    <rect x="0" y="96" width="303.2" height="6" rx="3" fill="#ffa116"/>

    <!-- Hard -->
    <text x="0" y="130" class="label">Hard</text>
    <text x="430" y="130" text-anchor="end" class="value">9</text>
    <rect x="0" y="136" width="430" height="6" rx="3" fill="#21262d"/>
    <rect x="0" y="136" width="27.8" height="6" rx="3" fill="#ff2d55"/>
  </g>

  <!-- Footer -->
  <line x1="24" y1="236" x2="676" y2="236" stroke="#21262d" stroke-width="1.5"/>
  <text x="24" y="253" class="footer">Coding Score: 529</text>
  <text x="676" y="253" text-anchor="end" class="footer">GeeksforGeeks</text>
</svg>
